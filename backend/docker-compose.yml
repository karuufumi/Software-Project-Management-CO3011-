services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-management-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/library.db
    volumes:
      # Persist database
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - library-network

networks:
  library-network:
    driver: bridge